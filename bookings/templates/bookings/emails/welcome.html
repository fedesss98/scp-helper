<!doctype html>
<html lang="it">
  <body style="margin:0; padding:0; background:#f6f4ef; color:#1f2933; font-family:Arial, Helvetica, sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f6f4ef; padding:24px 0;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:640px; background:#ffffff; border:1px solid #e4dfd3; border-radius:8px; overflow:hidden;">
            <tr>
              <td style="background:#17324d; color:#ffffff; padding:24px 28px;">
                <div style="font-size:13px; text-transform:uppercase; color:#d7c48e;">VogApp</div>
                <h1 style="margin:8px 0 0; font-size:24px; line-height:1.25;">Benvenuto in VogApp</h1>
              </td>
            </tr>
            <tr>
              <td style="padding:28px;">
                <p style="margin:0 0 16px; font-size:16px; line-height:1.5;">Ciao {{ display_name }},</p>
                <p style="margin:0 0 16px; font-size:16px; line-height:1.5;">Il tuo account su VogApp è stato creato.</p>
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="border-collapse:collapse; border:1px solid #e8e1d2; margin:20px 0;">
                  <tr>
                    <th align="left" style="width:34%; padding:12px; background:#fbfaf7; color:#56616f; font-size:14px;">Nome utente</th>
                    <td style="padding:12px; font-size:14px;">{{ username }}</td>
                  </tr>
                </table>
                <p style="margin:0 0 16px; font-size:16px; line-height:1.5;">Puoi accedere con il tuo nome utente e la password che ti è stata fornita.</p>
                <p style="margin:0; font-size:14px; line-height:1.5; color:#56616f;">Se non ti aspettavi questa email, ignorala oppure contatta l'amministratore del club.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
