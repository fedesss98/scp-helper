{% if shared_boat_bookings %}
<div class="shared-crew">
  <span class="shared-crew-title">Già prenotato per questa barca</span>
  <div class="shared-crew-list">
    {% for booking in shared_boat_bookings %}
    <span class="shared-crew-name">{{ booking.athlete.username }}</span>
    {% endfor %}
  </div>
</div>
{% endif %}
