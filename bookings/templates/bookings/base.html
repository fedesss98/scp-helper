{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}VogApp{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{% static 'bookings/css/base.css' %}" />
    {% block extra_css %}{% endblock %}
  </head>
  <body>
    {% include "bookings/partials/nav.html" %}

    <main class="container">
      {% include "bookings/partials/messages.html" %}
      {% block content %}{% endblock %}
    </main>

    <script src="{% static 'bookings/js/nav.js' %}"></script>
    {% block extra_js %}{% endblock %}
  </body>
</html>
